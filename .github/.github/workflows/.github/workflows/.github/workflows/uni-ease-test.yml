name: Uni Ease Backend Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check server syntax
        run: node --check server.js

      - name: Check frontend scripts
        run: |
          node --check inline-0.js
          node --check inline-1.js
          node --check public/service-worker.js
