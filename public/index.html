<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#D63384">
<link rel="manifest" href="/manifest.webmanifest">
<title>Uni Ease</title>
<style>
:root{
  --g:#D63384;
  --ink:#35212D;
  --muted:#887582;
  --bg:#FFF6FA;
  --card:#FFFFFF;
  --line:#F0DCE7;
  --rose:#FFE4F0;
  --deep:#A91E64;
  --shadow:0 8px 28px rgba(105,32,72,.07);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.55;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;transition:background .2s,transform .2s,box-shadow .2s}
button:hover{filter:brightness(.97)}
button:active{transform:scale(.98)}
.hidden{display:none!important}
top{
  display:block;
  background:linear-gradient(120deg,#C72576,#E64D9A);
  color:white;
  padding:22px 18px;
  box-shadow:0 4px 18px rgba(174,32,102,.12);
}
.topin{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.brand{font-weight:900;font-size:24px;letter-spacing:-.7px}
.brand span{color:#FFE1F0}
.wrap{max-width:1200px;margin:auto;padding:30px 20px 70px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card,.authbox{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:23px;
  box-shadow:var(--shadow);
}
.card{min-width:0;transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:0 12px 32px rgba(105,32,72,.1)}
.hero{
  background:linear-gradient(125deg,#FCE1EF,#FFF1F7 65%,#FFFFFF);
  border:1px solid #F4C9DE;
  border-radius:24px;
  padding:32px;
  margin-bottom:24px;
  box-shadow:var(--shadow);
}
h1,h2,h3{margin:0 0 12px;line-height:1.25;letter-spacing:-.35px}
h1{font-size:clamp(25px,4vw,36px);font-weight:800}
h2{font-size:23px}
h3{font-size:18px}
p{line-height:1.65}
.muted{color:var(--muted);font-size:14px}
.btn{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  border:0;
  border-radius:12px;
  padding:12px 18px;
  background:linear-gradient(135deg,#D63384,#B92370);
  color:white;
  font-weight:700;
  box-shadow:0 5px 13px rgba(190,35,112,.16);
}
.btn:hover{box-shadow:0 7px 17px rgba(190,35,112,.22)}
.btn.secondary{
  background:#FCE5F0;
  color:#A91E64;
  box-shadow:none;
  border:1px solid #F3CFE0;
}
input,select,textarea{
  width:100%;
  min-width:0;
  border:1px solid #E8D4DF;
  border-radius:12px;
  padding:13px 14px;
  background:#FFFCFE;
  color:var(--ink);
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus,select:focus,textarea:focus{
  border-color:#D63384;
  box-shadow:0 0 0 3px rgba(214,51,132,.10);
}
label{font-size:13px;font-weight:700;display:block;margin:13px 0 7px}
.spacer{height:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.badge{
  display:inline-block;
  padding:6px 11px;
  border-radius:30px;
  background:#FCE5F0;
  color:#A91E64;
  font-size:12px;
  font-weight:700;
}
.order{
  background:#FFFCFE;
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-top:13px;
}
.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  background:radial-gradient(ellipse at top left,#FADCEB 0,transparent 48%),var(--bg);
}
.authbox{width:min(460px,100%);padding:30px}
.tabs{display:flex;gap:8px;margin:22px 0 17px}
.tab{
  flex:1;
  padding:12px 10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#FFF8FC;
  color:var(--muted);
  font-weight:700;
}
.tab.active{
  background:#FCE5F0;
  color:#A91E64;
  border-color:#F1C7DB;
}
.toast{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:min(460px,calc(100% - 32px));
  background:#35212D;
  color:white;
  padding:14px 18px;
  border-radius:14px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
  z-index:1000;
}
@media(min-width:761px){
  .wrap{padding-top:34px}
}
@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  .grid,.grid2{grid-template-columns:1fr}
  .topin{flex-wrap:wrap}
  .wrap{padding:20px 15px 45px}
  .card{padding:19px}
  .hero{padding:24px 20px;border-radius:20px}
  .authbox{padding:23px}
  .brand{font-size:22px}
  .btn{max-width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script>
const app=document.getElementById('app');
let state={token:localStorage.getItem('ca_token'),user:null};

const api=async(path,opt={})=>{
 const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{})}});
 const d=await r.json().catch(()=>({error:'Invalid server response'}));
 if(!r.ok)throw new Error(d.error||'Request failed');
 return d;
};

function toast(s){
 const t=document.getElementById('toast');
 t.textContent=s;
 t.classList.remove('hidden');
 setTimeout(()=>t.classList.add('hidden'),3000);
}
function money(n){return '₦'+Number(n||0).toLocaleString()}
function esc(s){
 return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function status(s){return `<span class="badge">${esc(s.replace('_',' '))}</span>`}

async function boot(){
 if(state.token){
  try{state.user=(await api('/api/me')).user;await render()}
  catch{localStorage.removeItem('ca_token');state.token=null;renderAuth()}
 }else renderAuth();
}

function renderAuth(){
 app.innerHTML=`<div class="auth"><div class="authbox">
 <div class="brand" style="color:#D63384">UNI <span>EASE</span></div>
 <h1>Student life, simplified.</h1>
 <p class="muted">Place an errand. We get it done.</p>
 <div class="tabs">
 <button class="tab active" id="loginTab">Login</button>
 <button class="tab" id="signupTab">Create account</button>
 </div>
 <form id="authForm"></form>
 </div></div>`;

 let mode='login';
 const form=document.getElementById('authForm');

 function draw(){
  form.innerHTML=mode==='login'?`
   <label>Email</label><input name="email" type="email" required>
   <label>Password</label><input name="password" type="password" required>
   <div class="spacer"></div><button class="btn" style="width:100%">Log in</button>`
   :`
   <label>Name</label><input name="name" required>
   <label>Phone</label><input name="phone">
   <label>Email</label><input name="email" type="email" required>
   <label>Password</label><input name="password" type="password" minlength="6" required>
   <div class="spacer"></div><button class="btn" style="width:100%">Create account</button>`;
 }

 draw();

 document.getElementById('loginTab').onclick=()=>{
  mode='login';document.getElementById('loginTab').classList.add('active');
  document.getElementById('signupTab').classList.remove('active');draw();
 };
 document.getElementById('signupTab').onclick=()=>{
  mode='signup';document.getElementById('signupTab').classList.add('active');
  document.getElementById('loginTab').classList.remove('active');draw();
 };

 form.onsubmit=async e=>{
  e.preventDefault();
  try{
   const b=Object.fromEntries(new FormData(form).entries());
   const d=await api(mode==='login'?'/api/login':'/api/signup',{method:'POST',body:JSON.stringify(b)});
   state.token=d.token;state.user=d.user;
   localStorage.setItem('ca_token',state.token);
   await render();
  }catch(e){toast(e.message)}
 };
}

async function render(){
 app.innerHTML=`<header class="top"><div class="topin">
 <div class="brand">UNI <span>EASE</span></div>
 <div>${esc(state.user.name)} · ${esc(state.user.role)}
 <button class="btn secondary" id="changePassword">Change password</button> <button class="btn secondary" id="logout">Logout</button></div>
 </div></header><main class="wrap" id="main"></main>`;

 document.getElementById('changePassword').onclick=()=>showChangePassword();
 document.getElementById('logout').onclick=async()=>{
  try{await api('/api/logout',{method:'POST'})}catch{}
  localStorage.removeItem('ca_token');state.token=null;state.user=null;renderAuth();
 };

 const m=document.getElementById('main');
 if(state.user.role==='customer')await customer(m);
 else if(state.user.role==='worker')await worker(m);
 else await admin(m);
}

async function customer(m){
 const d=await api('/api/orders');
 m.innerHTML=`<section class="hero">
 <h1>Your time. Your focus. We've got the rest.</h1>
 <p class="muted">Request a campus errand and track it from your phone.</p>
 <button class="btn" id="newOrder">+ Request an errand</button>
 </section><div class="grid2">
 <div class="card"><h2>My orders</h2>
 <div>${d.orders.length?d.orders.map(o=>`
 <div class="order"><strong>#${o.id} · ${esc(o.service)}</strong>
 ${status(o.status)}<p>${esc(o.description)}</p>
 <p>${esc(o.delivery)} · <strong>${money(o.price)}</strong></p>
 <button class="btn secondary" onclick="viewOrder(${o.id})">Track order</button>
 <button class="btn secondary" onclick="viewChat(${o.id})">Order chat</button>
 ${o.status==='completed'?`<button class="btn secondary" onclick="rateOrder(${o.id})">Rate</button>`:''}
 </div>`).join(''):'<p class="muted">No orders yet.</p>'}</div>
 </div><div class="card"><h2>How it works</h2>
 <p>1. Tell us what you need.</p><p>2. We assign an assistant.</p>
 <p>3. Follow the status.</p><p>4. Get it done.</p></div></div>`;

 document.getElementById('newOrder').onclick=()=>newOrder(m);
}

async function newOrder(m){
 const s=await api('/api/services');
 m.innerHTML=`<div class="card"><h2>Request an errand</h2>
 <button class="btn secondary" onclick="dashboard()">Back</button>
 <form id="orderForm">
 <label>Service</label><select id="service">${s.services.map(x=>`<option value="${esc(x.name)}" data-base="${x.base}">${esc(x.name)} — from ${money(x.base)}</option>`).join('')}</select>
 <label>What do you need?</label><textarea id="description" rows="4" required></textarea>
 <label for="pickup">Pickup location</label>
 <input id="pickup" name="pickup" type="text" placeholder="Enter pickup address" required>
 <label for="delivery">Delivery / destination</label>
 <input id="delivery" name="delivery" type="text" placeholder="Enter delivery address" required>
 <label>Service price (₦)</label><input id="price" type="number" min="0" value="${s.services[0]?.base??1500}" readonly required>
 <p class="muted">Price is set by Uni Ease. You will see the current service price here.</p>
 <div class="spacer"></div><button class="btn">Place order</button>
 </form></div>`;

 document.getElementById('service').onchange=e=>{
  document.getElementById('price').value=e.target.selectedOptions[0].dataset.base;
 };
 document.getElementById('orderForm').onsubmit=async e=>{
  e.preventDefault();
  try{
   await api('/api/orders',{method:'POST',body:JSON.stringify({
    service:document.getElementById('service').value,
    description:document.getElementById('description').value,
    pickup:document.getElementById('pickup').value,
    delivery:document.getElementById('delivery').value,
    price:Number(document.getElementById('price').value)
   })});
   toast('Order placed successfully');await dashboard();
  }catch(x){toast(x.message)}
 };
}

async function viewOrder(id){
 const d=await api('/api/orders/'+id);const o=d.order;
 document.getElementById('main').innerHTML=`<div class="card">
 <h2>Order #${o.id}</h2><p>${esc(o.service)} · ${status(o.status)}</p>
 <p>${esc(o.description)}</p><p>Pickup location: ${esc(o.pickup || 'Not provided')}</p>
 <p>Delivery location: ${esc(o.delivery)}</p>
 <p>Assistant: ${esc(o.worker_name||'Waiting for assignment')}</p>
 <h3>Progress</h3>${d.events.map(e=>`<p>${esc(e.status)} — ${esc(e.note||'')}</p>`).join('')}
 <button class="btn" onclick="viewChat(${o.id})">Open order chat</button>
 <button class="btn" onclick="complaint(${o.id})">Report a problem</button>
 <button class="btn secondary" onclick="dashboard()">Back</button></div>`;
}

async function complaint(id){
 const message=prompt('Tell Uni Ease what went wrong:');
 if(!message)return;
 try{
  await api('/api/complaints',{method:'POST',body:JSON.stringify({orderId:id,message})});
  toast('Complaint submitted');await viewOrder(id);
 }catch(e){toast(e.message)}
}

async function rateOrder(id){
 const rating=prompt('Rating from 1 to 5:','5');
 if(!rating)return;
 const comment=prompt('Optional comment:','');
 try{
  await api('/api/ratings',{method:'POST',body:JSON.stringify({orderId:id,rating:Number(rating),comment})});
  toast('Thanks for your feedback');await dashboard();
 }catch(e){toast(e.message)}
}

async function worker(m){
 const d=await api('/api/orders');
 const available=d.orders.filter(o=>o.status==='pending'&&!o.worker_id);
 const mine=d.orders.filter(o=>o.worker_id===state.user.id);

 m.innerHTML=`<section class="hero"><h1>Worker dashboard</h1>
 <p>Accept jobs, update customers, and build a reliable service record.</p></section>
 <div class="grid2"><div class="card"><h2>Available orders</h2>
 ${available.map(o=>`<div class="order"><strong>#${o.id} · ${esc(o.service)}</strong>
 <p>${esc(o.description)}</p>
 <p>📍 Pickup location: ${esc(o.pickup||'Not provided')}</p>
 <p>🏁 Delivery location: ${esc(o.delivery||'Not provided')}</p>
 <p>Price: ${money(o.price)}</p>
 <button class="btn" onclick="acceptOrder(${o.id})">Accept job</button></div>`).join('')||'<p>No new jobs.</p>'}
 </div><div class="card"><h2>My orders</h2>
 ${mine.map(o=>`<div class="order"><strong>#${o.id} · ${esc(o.service)}</strong>
 ${status(o.status)}
 <p>${esc(o.description)}</p>
 <p>📍 Pickup location: ${esc(o.pickup||'Not provided')}</p>
 <p>🏁 Delivery location: ${esc(o.delivery||'Not provided')}</p>
 <button class="btn secondary" onclick="viewChat(${o.id})">Order chat</button>
 ${o.status==='accepted'?`<button class="btn" onclick="setStatus(${o.id},'in_progress')">Start job</button>`:''}
 ${o.status==='in_progress'?`<button class="btn" onclick="setStatus(${o.id},'completed')">Mark completed</button>`:''}
 </div>`).join('')||'<p>No assigned orders.</p>'}
 </div></div>`;
}

async function acceptOrder(id){
 try{await api('/api/orders/'+id+'/accept',{method:'POST'});toast('Job accepted');await dashboard()}
 catch(e){toast(e.message)}
}

async function setStatus(id,s){
 try{await api('/api/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status:s})});toast('Order updated');await dashboard()}
 catch(e){toast(e.message)}
}

async function admin(m){
 const [orders,workers,stats,complaints,services]=await Promise.all([
  api('/api/orders'),api('/api/workers'),api('/api/stats'),api('/api/complaints'),api('/api/services')
 ]);

 m.innerHTML=`<section class="hero"><h1>Admin control center</h1>
 <p>Monitor orders, assign assistants, and protect service quality.</p></section>
 <div class="grid"><div class="card">Orders<h1>${stats.total}</h1></div>
 <div class="card">Active jobs<h1>${stats.pending}</h1></div>
 <div class="card">Completed value<h1>${money(stats.revenue)}</h1></div></div>
 <div class="card" style="margin:14px 0"><h2>Manage service prices</h2>
 <p class="muted">Changes apply to new orders only. Existing orders keep their original price.</p>
 <div class="grid2">${services.services.map(s=>`<form class="order priceForm" data-service-id="${s.id}">
 <label>${esc(s.name)}</label><input type="number" name="base" min="0" max="100000000" step="1" value="${s.base}" required>
 <div class="spacer"></div><button class="btn">Save price</button></form>`).join('')}</div></div>
 <div class="grid2"><div class="card"><h2>Orders</h2>
 ${orders.orders.map(o=>`<div class="order"><strong>#${o.id} · ${esc(o.service)}</strong>
 ${status(o.status)}<p>${esc(o.customer_name)} · ${esc(o.delivery)}</p>
 <p>${esc(o.description)}</p><p><strong>${money(o.price)}</strong></p>
 <button class="btn secondary" onclick="viewChat(${o.id})">View order chat/files</button></div>`).join('')||'<p>No orders.</p>'}
 </div><div class="card"><h2>Workers</h2>
 ${workers.workers.map(w=>`<div class="order"><strong>${esc(w.name)}</strong><p>${esc(w.email)}</p></div>`).join('')}
 <h2>Open complaints</h2>
 ${complaints.complaints.filter(c=>c.status!=='resolved').map(c=>`<div class="order"><strong>Order #${c.order_id}</strong>
 <p>${esc(c.message)}</p><button class="btn" onclick="resolveComplaint(${c.id})">Resolve</button></div>`).join('')||'<p>No open complaints.</p>'}
 </div></div>`;

 m.querySelectorAll('.priceForm').forEach(form=>form.onsubmit=async e=>{
  e.preventDefault();
  const id=form.dataset.serviceId;
  const base=Number(new FormData(form).get('base'));
  if(!Number.isSafeInteger(base)||base<0){toast('Enter a valid price');return}
  const button=form.querySelector('button');button.disabled=true;
  try{await api('/api/services/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({base})});toast('Service price saved');await admin(m)}
  catch(err){toast(err.message);button.disabled=false}
 });
}

async function viewChat(id){
 const main=document.getElementById('main');
 try{
  const d=await api(`/api/orders/${id}/messages`);
  main.innerHTML=`<div class="card"><div class="between"><div><h2>Order #${id} chat</h2>
  <p class="muted">Messages and files are visible to the customer, assigned worker, and Uni Ease admin.</p></div>
  <button class="btn secondary" onclick="dashboard()">Back</button></div>
  <div id="chatMessages">${d.messages.map(renderMessage).join('')||'<p class="muted">No messages yet. Send a message or attach a file below.</p>'}</div>
  <form id="chatForm"><label>Message</label><textarea id="chatText" rows="3" maxlength="2000" placeholder="Write a message about this order"></textarea>
  <label>Attach photo, video, PDF, or Word document (max 10 MB)</label>
  <input id="chatFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,application/pdf,.doc,.docx,.txt">
  <div class="spacer"></div><button class="btn" id="sendChat">Send</button>
  <button type="button" class="btn secondary" onclick="viewChat(${id})">Refresh chat</button></form></div>`;

  document.getElementById('chatForm').onsubmit=async e=>{
   e.preventDefault();
   const button=document.getElementById('sendChat');button.disabled=true;
   try{
    const message=document.getElementById('chatText').value.trim();
    const file=document.getElementById('chatFile').files[0];
    const payload={message};
    if(file){
     if(file.size>10*1024*1024)throw new Error('Each file must be 10 MB or smaller.');
     payload.file={name:file.name,type:file.type||'application/octet-stream',data:await fileToDataUrl(file)};
    }
    if(!message&&!file)throw new Error('Write a message or choose a file first.');
    await api(`/api/orders/${id}/messages`,{method:'POST',body:JSON.stringify(payload)});
    toast('Message sent');await viewChat(id);
   }catch(err){toast(err.message);button.disabled=false}
  };
 }catch(e){toast(e.message)}
}

function fileToDataUrl(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onload=()=>resolve(r.result);
  r.onerror=()=>reject(new Error('Could not read this file.'));
  r.readAsDataURL(file);
 });
}

function renderMessage(m){
 const file=m.file_url?`<p><a href="${esc(m.file_url)}" target="_blank" rel="noopener noreferrer">📎 ${esc(m.file_name||'Open attachment')}</a> <span class="muted">(${(Number(m.file_size||0)/1024/1024).toFixed(2)} MB)</span></p>`:'';
 return `<div class="order"><div class="between"><strong>${esc(m.sender_name)} (${esc(m.sender_role)})</strong><span class="muted">${esc(m.created_at)}</span></div>
 ${m.message?`<p style="white-space:pre-wrap">${esc(m.message)}</p>`:''}${file}
 ${m.file_path&&!m.file_url?'<p class="muted">Attachment link unavailable. Check Supabase storage configuration.</p>':''}</div>`;
}

async function dashboard(){await render()}

function showChangePassword(){
 const main=document.getElementById('main');
 main.innerHTML=`<div class="card"><h2>Change password</h2>
 <p class="muted">Choose a new password with at least 8 characters. Your current login will remain active.</p>
 <form id="changePasswordForm">
 <label>Current password</label><input name="currentPassword" type="password" autocomplete="current-password" required>
 <label>New password</label><input name="newPassword" type="password" minlength="8" autocomplete="new-password" required>
 <label>Confirm new password</label><input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
 <div class="spacer"></div><button class="btn">Save new password</button>
 <button class="btn secondary" type="button" onclick="dashboard()">Cancel</button></form></div>`;

 document.getElementById('changePasswordForm').onsubmit=async e=>{
  e.preventDefault();
  const b=Object.fromEntries(new FormData(e.currentTarget).entries());
  if(b.newPassword!==b.confirmPassword){toast('The new passwords do not match.');return}
  try{
   const d=await api('/api/change-password',{method:'POST',body:JSON.stringify({currentPassword:b.currentPassword,newPassword:b.newPassword})});
   toast(d.message||'Password changed.');await dashboard();
  }catch(err){toast(err.message)}
 };
}

async function resolveComplaint(id){
 if(!confirm('Mark this complaint as resolved?'))return;
 try{
  await api(`/api/complaints/${id}/resolve`,{method:'POST'});
  toast('Complaint resolved');
  await render();
 }catch(e){toast(e.message)}
}

window.showChangePassword=showChangePassword;
window.viewOrder=viewOrder;
window.viewChat=viewChat;
window.resolveComplaint=resolveComplaint;
window.complaint=complaint;
window.rateOrder=rateOrder;
window.acceptOrder=acceptOrder;
window.setStatus=setStatus;
window.dashboard=dashboard;

boot();
